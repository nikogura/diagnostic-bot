replicaCount: 1

image:
  repository: ghcr.io/nikogura/diagnostic-bot
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion when empty.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  # IRSA: annotate with the IAM role to assume for AWS access (ECR scans, the
  # CloudWatch Logs/Metrics/Alarms tools, and the AWS read tools). The role needs
  # the read-only actions documented in the README ("AWS IAM Permissions"). Note
  # ECR and the AWS read tools also require config.AWS_REGION to be set. Example:
  #   annotations:
  #     eks.amazonaws.com/role-arn: arn:aws:iam::111111111111:role/diagnostic-bot-cw-reader
  annotations: {}

# Read-only ClusterRole/Binding for the in-cluster Kubernetes tools. Grants
# get/list/watch on diagnostic resources only — never secrets, never any write
# verb. Disable if you manage RBAC yourself, or if the bot has no k8s tools.
rbac:
  create: true

# Port the bot serves /metrics and health probes on (admin port, never the
# client-facing MCP port).
metricsPort: 9090

# Externally-facing MCP HTTP server for power users running their own MCP client.
mcpHttp:
  enabled: false
  port: 8090

# Non-secret configuration, surfaced as environment variables. List-valued vars
# accept commas AND newlines, so a YAML block scalar stays readable.
config:
  LOKI_ENDPOINT: ""
  CLAUDE_MODEL: "claude-sonnet-4-5-20250929"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  # AWS region — enables the ECR scan tool and the AWS read tools
  # (sts/iam/ec2/route53/s3). Required even with IRSA credentials. Leave empty
  # to disable those families. See the README "AWS IAM Permissions".
  AWS_REGION: ""
  # CloudWatch Logs, Metrics, and Alarms tools (all read-only). Leave empty to
  # disable. Set ONE of the two styles, and grant the pod AWS credentials via
  # serviceAccount.annotations (IRSA) with the IAM actions documented in the
  # README ("AWS IAM Permissions"). Empty values are not rendered.
  #
  # Multi-account: JSON map of friendly name -> role ARN to assume. Newlines OK.
  CLOUDWATCH_ACCOUNTS: ""
  # Legacy single-account: one role ARN to assume (omit to use the pod's own
  # IRSA credentials directly).
  CLOUDWATCH_ASSUME_ROLE: ""
  # Optional external ID, when the target role's trust policy requires it.
  CLOUDWATCH_EXTERNAL_ID: ""
  # Extra raw env vars, merged verbatim.
  extraEnv: {}

# Role-based tool authorization (RBAC). See the README "Tool Authorization
# (RBAC)" section. Leave both `policy` and `existingConfigMap` empty to disable
# authorization (every caller gets the full tool surface). When enabled, the
# policy is mounted and MCP_AUTHZ_FILE is set automatically.
authz:
  # Inline policy — the full YAML document including the top-level `authz:` key
  # (copy examples/authz.yaml). When set, the chart renders a ConfigMap from it.
  policy: ""
  # Alternatively, the name of an existing ConfigMap holding the policy under
  # `key`. Takes precedence over `policy`.
  existingConfigMap: ""
  # ConfigMap data key and the mounted filename.
  key: authz.yaml
  # Directory the policy file is mounted into.
  mountPath: /etc/diagnostic-bot

# Third-party API tools. See the README "Third-Party API Integrations" section.
# Leave both `configs` and `existingConfigMap` empty to disable (no API tools).
# When set, the configs are mounted as a directory and API_CONFIG_DIR is set to
# it automatically. Each config's auth token comes from the Secret
# (existingSecret), read by the token_env named inside the config.
#
# Write endpoints (POST/PUT/PATCH/DELETE) are off by default. Enable specific
# verbs deployment-wide via config.extraEnv.API_ALLOWED_METHODS (e.g. "POST");
# READ_ONLY still overrides. See the README "Third-Party API Integrations".
apiConfigs:
  # Inline configs: a map of filename -> YAML document (copy apis/bitgo.yaml).
  # Each key becomes a *.yaml file in the mounted directory.
  configs: {}
  # Alternatively, the name of an existing ConfigMap whose keys are *.yaml API
  # configs. Takes precedence over `configs`.
  existingConfigMap: ""
  # Directory the configs are mounted into; also the value of API_CONFIG_DIR.
  mountPath: /etc/diagnostic-bot/apis

# Secret holding SLACK_BOT_TOKEN, SLACK_APP_TOKEN, ANTHROPIC_API_KEY, etc.
# Mounted via envFrom so rotation is a secret change, not a manifest change.
existingSecret: ""

# Resource requests/limits. Both are set so the dashboard's "% of request" and
# "% of limit" panels are meaningful.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}

# Prometheus Operator monitors. Both forms are shipped; enable whichever your
# cluster scrapes with.
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

podMonitor:
  enabled: false
  interval: 30s
  labels: {}

# The Grafana dashboard ships as a JSON artifact at dashboards/diagnostic-bot.json.
# Import it through whatever dashboard provisioning you already run; the chart
# does not impose a delivery mechanism.
