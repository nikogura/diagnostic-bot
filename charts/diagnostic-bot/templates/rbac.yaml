{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "diagnostic-bot.fullname" . }}
  labels:
    {{- include "diagnostic-bot.labels" . | nindent 4 }}
# Read-only diagnostic access. Secrets are deliberately NOT granted, and no
# write/patch/delete verb appears anywhere in this role.
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "configmaps", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["db.atlasgo.io"]
    resources: ["atlasmigrations"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "diagnostic-bot.fullname" . }}
  labels:
    {{- include "diagnostic-bot.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "diagnostic-bot.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "diagnostic-bot.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
