apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "diagnostic-bot.fullname" . }}
  labels:
    {{- include "diagnostic-bot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "diagnostic-bot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "diagnostic-bot.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "diagnostic-bot.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: diagnostic-bot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
              protocol: TCP
            {{- if .Values.mcpHttp.enabled }}
            - name: mcp
              containerPort: {{ .Values.mcpHttp.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: METRICS_PORT
              value: {{ .Values.metricsPort | quote }}
            {{- if .Values.mcpHttp.enabled }}
            - name: MCP_HTTP_ENABLED
              value: "true"
            - name: MCP_HTTP_PORT
              value: {{ .Values.mcpHttp.port | quote }}
            {{- end }}
            {{- range $key, $value := .Values.config }}
            {{- if and (ne $key "extraEnv") (ne (toString $value) "") }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- range $key, $value := .Values.config.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if or .Values.authz.policy .Values.authz.existingConfigMap }}
            - name: MCP_AUTHZ_FILE
              value: {{ printf "%s/%s" .Values.authz.mountPath .Values.authz.key | quote }}
            {{- end }}
            {{- if or .Values.apiConfigs.configs .Values.apiConfigs.existingConfigMap }}
            - name: API_CONFIG_DIR
              value: {{ .Values.apiConfigs.mountPath | quote }}
            {{- end }}
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- end }}
          {{- if or .Values.authz.policy .Values.authz.existingConfigMap .Values.apiConfigs.configs .Values.apiConfigs.existingConfigMap }}
          volumeMounts:
            {{- if or .Values.authz.policy .Values.authz.existingConfigMap }}
            - name: authz-policy
              mountPath: {{ .Values.authz.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if or .Values.apiConfigs.configs .Values.apiConfigs.existingConfigMap }}
            - name: api-configs
              mountPath: {{ .Values.apiConfigs.mountPath | quote }}
              readOnly: true
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or .Values.authz.policy .Values.authz.existingConfigMap .Values.apiConfigs.configs .Values.apiConfigs.existingConfigMap }}
      volumes:
        {{- if or .Values.authz.policy .Values.authz.existingConfigMap }}
        - name: authz-policy
          configMap:
            name: {{ .Values.authz.existingConfigMap | default (printf "%s-authz" (include "diagnostic-bot.fullname" .)) }}
        {{- end }}
        {{- if or .Values.apiConfigs.configs .Values.apiConfigs.existingConfigMap }}
        - name: api-configs
          configMap:
            name: {{ .Values.apiConfigs.existingConfigMap | default (printf "%s-apis" (include "diagnostic-bot.fullname" .)) }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
