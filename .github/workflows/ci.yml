name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: '1.25'

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.semver.outputs.version_tag }}
      version: ${{ steps.semver.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Compute the next semantic version from commit messages since the last
    # tag (conventional-commits style):
    #   - MAJOR  → a "type!:" subject (e.g. "feat!: ...") OR a "BREAKING CHANGE:"
    #              / "BREAKING-CHANGE:" footer anywhere in a commit body.
    #   - MINOR  → a "feat:" / "feat(scope):" subject.
    #   - PATCH  → anything else.
    # Outputs `version` (1.2.3) and `version_tag` (v1.2.3). The previous hand-
    # rolled step could only ever bump PATCH, so breaking changes were impossible
    # to release correctly.
    - name: Generate Version
      id: semver
      uses: paulhatch/semantic-version@v5.4.0
      with:
        tag_prefix: "v"
        version_format: "${major}.${minor}.${patch}"
        major_pattern: '/^[a-z]+(\([^)]+\))?!:|BREAKING[ -]CHANGE:/'
        major_regexp_flags: "im"
        minor_pattern: '/^feat(\([^)]+\))?:/'
        minor_regexp_flags: "im"
        search_commit_body: true
        bump_each_commit: false

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Download dependencies
      run: go mod download

    # Install every tool the Makefile targets need BEFORE running them:
    # namedreturns + golangci-lint for `make lint`, kustomize + helm for the
    # distro renders folded into `make test`.
    - name: Install namedreturns
      run: go install github.com/nikogura/namedreturns@latest

    - name: Install golangci-lint
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

    - name: Install kustomize
      run: go install sigs.k8s.io/kustomize/kustomize/v5@v5.4.3

    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.16.3

    - name: Lint Checks
      run: make lint

    - name: Test (unit + distro renders)
      run: make test

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        build-args: |
          VERSION=${{ needs.test.outputs.version }}
        tags: |
          ghcr.io/nikogura/diagnostic-bot:${{ needs.test.outputs.version_tag }}
          ghcr.io/nikogura/diagnostic-bot:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.16.3

    - name: Package and push Helm chart to ghcr
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
        helm package charts/diagnostic-bot \
          --version ${{ needs.test.outputs.version }} \
          --app-version ${{ needs.test.outputs.version }}
        helm push diagnostic-bot-${{ needs.test.outputs.version }}.tgz oci://ghcr.io/nikogura/charts

    # The release creates the git tag (single `v` prefix). The previous
    # mathieudutour/github-tag-action step was removed: it prepended its own
    # default `v` to an already-`v`-prefixed custom_tag, producing the duplicate
    # `vv0.0.x` tags alongside the release's `v0.0.x` tags.
    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.test.outputs.version_tag }}
        name: ${{ needs.test.outputs.version_tag }}
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}
