apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnostic-bot
  labels:
    app.kubernetes.io/name: diagnostic-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: diagnostic-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: diagnostic-bot
    spec:
      serviceAccountName: diagnostic-bot
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: diagnostic-bot
          image: ghcr.io/nikogura/diagnostic-bot:0.2.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: METRICS_PORT
              value: "9090"
            - name: CLAUDE_MODEL
              value: "claude-sonnet-4-5-20250929"
            # List-valued vars accept commas AND newlines; a block scalar stays readable.
            - name: LOKI_ENDPOINT
              value: "http://loki-gateway.monitoring.svc:80"
            # OTLP endpoint is optional; tracing is no-op when unset.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo-distributor.monitoring.svc:4318"
            # Role-based tool authorization (RBAC). Uncomment, mount the policy
            # below, and create the ConfigMap from examples/authz.yaml:
            #   kubectl create configmap diagnostic-bot-authz \
            #     --from-file=authz.yaml=examples/authz.yaml
            # Unset = authorization disabled (all tools available to all callers).
            # - name: MCP_AUTHZ_FILE
            #   value: "/etc/diagnostic-bot/authz.yaml"
            # Third-party API tools (see README "Third-Party API Integrations").
            # Uncomment, mount the configs below, and create the ConfigMap from
            # your apis/*.yaml (each config's token_env comes from the Secret):
            #   kubectl create configmap diagnostic-bot-apis --from-file=apis/
            # Unset = no third-party API tools.
            # - name: API_CONFIG_DIR
            #   value: "/etc/diagnostic-bot/apis"
          # Secret carries SLACK_BOT_TOKEN, SLACK_APP_TOKEN, ANTHROPIC_API_KEY.
          envFrom:
            - secretRef:
                name: diagnostic-bot-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # Mounts for the RBAC policy and/or third-party API configs (see the
          # env vars above). Uncomment the entries you actually use.
          # volumeMounts:
          #   - name: authz-policy
          #     mountPath: /etc/diagnostic-bot
          #     readOnly: true
          #   - name: api-configs
          #     mountPath: /etc/diagnostic-bot/apis
          #     readOnly: true
      # volumes:
      #   - name: authz-policy
      #     configMap:
      #       name: diagnostic-bot-authz
      #   - name: api-configs
      #     configMap:
      #       name: diagnostic-bot-apis
