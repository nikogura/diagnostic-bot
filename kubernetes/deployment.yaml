apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnostic-bot
  labels:
    app.kubernetes.io/name: diagnostic-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: diagnostic-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: diagnostic-bot
    spec:
      serviceAccountName: diagnostic-bot
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: diagnostic-bot
          image: ghcr.io/nikogura/diagnostic-bot:0.2.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: METRICS_PORT
              value: "9090"
            - name: CLAUDE_MODEL
              value: "claude-sonnet-4-5-20250929"
            # List-valued vars accept commas AND newlines; a block scalar stays readable.
            - name: LOKI_ENDPOINT
              value: "http://loki-gateway.monitoring.svc:80"
            # OTLP endpoint is optional; tracing is no-op when unset.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo-distributor.monitoring.svc:4318"
          # Secret carries SLACK_BOT_TOKEN, SLACK_APP_TOKEN, ANTHROPIC_API_KEY.
          envFrom:
            - secretRef:
                name: diagnostic-bot-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
