apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnostic-bot
  labels:
    app.kubernetes.io/name: diagnostic-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: diagnostic-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: diagnostic-bot
    spec:
      serviceAccountName: diagnostic-bot
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: diagnostic-bot
          image: ghcr.io/nikogura/diagnostic-bot:0.2.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: METRICS_PORT
              value: "9090"
            - name: CLAUDE_MODEL
              value: "claude-sonnet-4-5-20250929"
            # List-valued vars accept commas AND newlines; a block scalar stays readable.
            - name: LOKI_ENDPOINT
              value: "http://loki-gateway.monitoring.svc:80"
            # OTLP endpoint is optional; tracing is no-op when unset.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo-distributor.monitoring.svc:4318"
            # AWS region — required to enable the ECR scan tool and the AWS read
            # tools (sts/iam/ec2/route53/s3). Set it even when credentials come
            # from IRSA. See the README "AWS IAM Permissions" for the actions.
            # - name: AWS_REGION
            #   value: "us-east-1"
            # CloudWatch Logs, Metrics, and Alarms tools (all read-only). Enable
            # by giving the pod AWS credentials — the ServiceAccount IRSA role
            # (see serviceaccount.yaml) is the recommended path — and setting one
            # of the two config styles below. Required IAM actions are documented
            # in the README ("AWS IAM Permissions").
            #
            # Multi-account: JSON map of friendly name -> role ARN to assume.
            # - name: CLOUDWATCH_ACCOUNTS
            #   value: |-
            #     {"dev":"arn:aws:iam::111111111111:role/diagnostic-bot-cw-reader",
            #      "prod":"arn:aws:iam::222222222222:role/diagnostic-bot-cw-reader"}
            # Legacy single-account: one role ARN to assume (omit to use the
            # pod's own IRSA credentials directly).
            # - name: CLOUDWATCH_ASSUME_ROLE
            #   value: "arn:aws:iam::111111111111:role/diagnostic-bot-cw-reader"
            # Optional external ID, when the target role's trust policy requires it.
            # - name: CLOUDWATCH_EXTERNAL_ID
            #   value: "org-12345"
            # Role-based tool authorization (RBAC). Uncomment, mount the policy
            # below, and create the ConfigMap from examples/authz.yaml:
            #   kubectl create configmap diagnostic-bot-authz \
            #     --from-file=authz.yaml=examples/authz.yaml
            # Unset = authorization disabled (all tools available to all callers).
            # - name: MCP_AUTHZ_FILE
            #   value: "/etc/diagnostic-bot/authz.yaml"
            # Third-party API tools (see README "Third-Party API Integrations").
            # Uncomment, mount the configs below, and create the ConfigMap from
            # your apis/*.yaml (each config's token_env comes from the Secret):
            #   kubectl create configmap diagnostic-bot-apis --from-file=apis/
            # Unset = no third-party API tools.
            # - name: API_CONFIG_DIR
            #   value: "/etc/diagnostic-bot/apis"
          # Secret carries SLACK_BOT_TOKEN, SLACK_APP_TOKEN, ANTHROPIC_API_KEY.
          envFrom:
            - secretRef:
                name: diagnostic-bot-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # Mounts for the RBAC policy and/or third-party API configs (see the
          # env vars above). Uncomment the entries you actually use.
          # volumeMounts:
          #   - name: authz-policy
          #     mountPath: /etc/diagnostic-bot
          #     readOnly: true
          #   - name: api-configs
          #     mountPath: /etc/diagnostic-bot/apis
          #     readOnly: true
      # volumes:
      #   - name: authz-policy
      #     configMap:
      #       name: diagnostic-bot-authz
      #   - name: api-configs
      #     configMap:
      #       name: diagnostic-bot-apis
