apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: diagnostic-bot
  labels:
    app.kubernetes.io/name: diagnostic-bot
# Read-only diagnostic access. Secrets are deliberately NOT granted, and no
# write/patch/delete verb appears anywhere in this role.
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "configmaps", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["db.atlasgo.io"]
    resources: ["atlasmigrations"]
    verbs: ["get", "list", "watch"]
