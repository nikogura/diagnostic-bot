apiVersion: v1
kind: ServiceAccount
metadata:
  name: diagnostic-bot
  labels:
    app.kubernetes.io/name: diagnostic-bot
  # AWS access (ECR scans, the CloudWatch Logs/Metrics/Alarms tools, and the AWS
  # read tools) is granted via IRSA — annotate this ServiceAccount with the IAM
  # role to assume. The role needs the read-only actions documented in the README
  # ("AWS IAM Permissions"). ECR and the AWS read tools also require AWS_REGION to
  # be set on the pod. Uncomment and set your role ARN:
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::111111111111:role/diagnostic-bot-cw-reader
