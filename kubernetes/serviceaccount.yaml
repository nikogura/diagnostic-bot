apiVersion: v1
kind: ServiceAccount
metadata:
  name: diagnostic-bot
  labels:
    app.kubernetes.io/name: diagnostic-bot
  # AWS access (ECR scans, and the CloudWatch Logs/Metrics/Alarms tools) is
  # granted via IRSA — annotate this ServiceAccount with the IAM role to assume.
  # The role needs the read-only actions documented in the README ("CloudWatch
  # IAM Permissions"). Uncomment and set your role ARN:
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::111111111111:role/diagnostic-bot-cw-reader
