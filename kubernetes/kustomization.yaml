apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Kustomize example deployment of the diagnostic bot. The Helm chart under
# charts/diagnostic-bot is the templated alternative; this is the plain-manifest
# reference.

namespace: diagnostic-bot

resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  - podmonitor.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: diagnostic-bot
    includeSelectors: false

# The Grafana dashboard ships as a JSON artifact at dashboards/diagnostic-bot.json;
# import it via your existing dashboard provisioning. It is intentionally not
# wrapped in a ConfigMap here.
